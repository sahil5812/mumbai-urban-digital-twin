<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2"/>

  <!-- High-Tech Radar Ring Accent -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Modern Geometric Stylized R -->
  <path d="M 40 32 L 68 32 C 82 32 88 40 88 52 C 88 64 80 70 68 70 L 54 70 L 54 96 L 40 96 Z M 54 44 L 54 58 L 66 58 C 72 58 74 55 74 51 C 74 46 71 44 66 44 Z" fill="url(#rGrad)" filter="url(#glow)"/>
  <path d="M 64 66 L 86 96 L 70 96 L 52 70 Z" fill="url(#rGrad)"/>

  <!-- Glowing 4-Point Nova Star at Upper Right -->
  <path d="M 96 24 Q 96 36 84 36 Q 96 36 96 48 Q 96 36 108 36 Q 96 36 96 24 Z" fill="url(#starGrad)" filter="url(#glow)"/>
</svg>
